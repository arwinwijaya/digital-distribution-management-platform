; php-fpm pool overrides.
;
; clear_env defaults to "yes", which strips all container environment variables
; before workers handle a request. Laravel then sees no APP_KEY/JWT_SECRET and
; falls back to broken defaults. Set to "no" so compose env_file/environment
; values reach the app (in addition to the config:cache warm-up in the entrypoint).
[www]
clear_env = no
