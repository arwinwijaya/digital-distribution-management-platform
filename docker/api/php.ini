; Production PHP overrides for the API container.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.jit=off

memory_limit=256M
max_execution_time=60
expose_php=Off

; Log PHP errors to stderr so `docker compose logs` captures them.
log_errors=On
error_log=/dev/stderr
display_errors=Off
