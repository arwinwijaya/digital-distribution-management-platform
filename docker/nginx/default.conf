# Production reverse proxy for the DDP stack.
#
#   /api/*   → Laravel (php-fpm in the `api` container, FastCGI)
#   /*       → Next.js standalone server (`web` container)
#
# nginx runs in its own container and does NOT contain the application source.
# FastCGI resolves SCRIPT_FILENAME inside the `api` container, so we point it at
# the absolute path there (/var/www/html/public/index.php) instead of relying on
# try_files against nginx's own (empty) document root.
upstream nextjs {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # ── Laravel API (php-fpm) ───────────────────────────────────────────────
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param PATH_INFO       "";
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── Next.js standalone ──────────────────────────────────────────────────
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
