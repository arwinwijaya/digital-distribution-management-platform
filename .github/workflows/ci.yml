name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Laravel API Tests
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ddp_test
          POSTGRES_USER: ddp_user
          POSTGRES_PASSWORD: ddp_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pgsql, intl
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir --working-dir=apps/api)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare Laravel directories
        working-directory: apps/api
        run: mkdir -p bootstrap/cache storage/framework/{sessions,views,cache} storage/logs

      - name: Install Dependencies
        working-directory: apps/api
        run: composer install --no-progress --prefer-dist --no-interaction --optimize-autoloader

      - name: Prepare Environment
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Migrations & Tests
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: ddp_test
          DB_USERNAME: ddp_user
          DB_PASSWORD: ddp_password
        run: |
          php artisan migrate --force
          php artisan test --without-tty

  # Next.js Web Tests
  web-tests:
    name: Web Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Lint
        working-directory: apps/web
        run: npm run lint

      - name: Run Tests
        working-directory: apps/web
        run: npm run test

      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

  # Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [api-tests, web-tests]
    
    steps:
      - uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -t ddp-api:latest -f apps/api/Dockerfile .

      - name: Build Web Image
        run: docker build -t ddp-web:latest -f apps/web/Dockerfile .
