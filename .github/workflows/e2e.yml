name: E2E Workflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Generate .env for docker compose
        run: |
          cp .env.example .env
          # Generate required secrets without printing them to CI logs.
          APP_KEY=$(php -r "echo 'base64:'.base64_encode(random_bytes(32)).PHP_EOL;")
          JWT_SECRET=$(openssl rand -hex 32)
          sed -i "s/^APP_KEY=.*/APP_KEY=$APP_KEY/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$JWT_SECRET/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=secret123/" .env
          sed -i "s|^NEXT_PUBLIC_API_URL=.*|NEXT_PUBLIC_API_URL=http://localhost:8080/api|" .env

      - name: Install API dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm install

      - name: Build Docker images
        run: docker compose build --no-cache

      - name: Start services
        run: docker compose up -d

      - name: Wait for services ready
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8080/api/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100 api nginx
          exit 1

      - name: Seed database
        run: bash scripts/e2e-seed.sh

      - name: Run API e2e tests (Jest)
        working-directory: apps/web
        run: npm run test:e2e

      - name: Run Playwright UI tests
        uses: docker://mcr.microsoft.com/playwright:v1.48.0-jammy
        with:
          args: /bin/sh -c "cd /github/workspace/apps/web && npm install && npx playwright test --project=chromium"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            apps/web/test-results/**
            apps/web/playwright-report/**
          if-no-files-found: warn
          retention-days: 30