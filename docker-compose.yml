# Production stack for the Digital Distribution Management Platform.
#
#   docker compose -f docker-compose.yml up -d --build      # production
#   docker compose up -d --build                            # dev (override auto-merged)
#
# Images are immutable (no bind mounts). Secrets and connection settings come
# from the root .env file (see .env.example) — never hardcoded here.
#
# Traffic flow:  browser → nginx:80 → ( /api/* → api:9000 php-fpm
#                                      \ /*     → web:3000 Next standalone )
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ddp_database}
      POSTGRES_USER: ${DB_USERNAME:-ddp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ddp_user} -d ${DB_DATABASE:-ddp_database}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Laravel API (php-fpm). Only this service runs migrations.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      RUN_MIGRATIONS: "1"
      WAIT_FOR_DB: "1"
      WARM_CACHES: "1"
      TELESCOPE_ENABLED: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "true"
      QUEUE_CONNECTION: redis
      TRUSTED_PROXIES: "*"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"

  # Queue worker (Redis driver).
  queue-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      RUN_MIGRATIONS: "0"
      WAIT_FOR_DB: "1"
      WARM_CACHES: "0"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600", "--verbose"]
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  # Scheduler (invoices:reminders every minute, data:pipeline daily).
  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      RUN_MIGRATIONS: "0"
      WAIT_FOR_DB: "1"
      WARM_CACHES: "0"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "schedule:work", "--verbose"]
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  # Next.js standalone server.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started

  # Reverse proxy: single public entrypoint on APP_PORT (default 8080).
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      # Use 127.0.0.1 explicitly: busybox wget resolves `localhost` to ::1 first,
      # but nginx only listens on IPv4 (0.0.0.0:80), so it would report refused.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
