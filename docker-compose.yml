version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ddp_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ddp_database
      POSTGRES_USER: ddp_user
      POSTGRES_PASSWORD: ddp_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddp_user -d ddp_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ddp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ddp_api
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ddp_database
      DB_USERNAME: ddp_user
      DB_PASSWORD: ddp_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_STORE: file
      APP_KEY: "base64:IW7FET2cdWfbubYon2CM8vcWw9coOh6imBe0qWuNp3w="
      JWT_SECRET: "jwt-secret-for-local"
      JWT_ALGO: HS256
      JWT_TTL: 60
      # JWT API (tymon/jwt-auth) is stateless: never treat the browser origin as a
      # stateful Sanctum frontend, otherwise Sanctum injects CSRF validation into
      # /api/* and login fails with 419 "CSRF token mismatch". See app/Http/Kernel.php.
      SANCTUM_STATEFUL_DOMAINS: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ddp_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
