services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ddp_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ddp_database
      POSTGRES_USER: ddp_user
      POSTGRES_PASSWORD: ddp_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddp_user -d ddp_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ddp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mail catcher (dev only) — MAIL_HOST=mailpit in apps/api/.env points here.
  # Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ddp_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ddp_api
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ddp_database
      DB_USERNAME: ddp_user
      DB_PASSWORD: ddp_password
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: database
      APP_KEY: "base64:IW7FET2cdWfbubYon2CM8vcWw9coOh6imBe0qWuNp3w="
      JWT_SECRET: "jwt-secret-for-local"
      JWT_ALGO: HS256
      JWT_TTL: 60
      # JWT API (tymon/jwt-auth) is stateless: never treat the browser origin as a
      # stateful Sanctum frontend, otherwise Sanctum injects CSRF validation into
      # /api/* and login fails with 419 "CSRF token mismatch". See app/Http/Kernel.php.
      SANCTUM_STATEFUL_DOMAINS: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # Full HTTP check (proves the app boots and serves, not just that the port
      # is bound). Bootstrap is slow over a bind-mounted source tree on Windows
      # (~7s), so the timeout must be generous or the check flaps locally.
      test: ["CMD-SHELL", "curl -fsS --max-time 15 http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ddp_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:20-alpine ships wget (no curl). The Next dev server compiles on
      # first request, so allow a long start_period before it is judged.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
